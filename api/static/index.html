<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lambda Canteen Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font: 14px/1.4 system-ui, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #222;
      background: #fafafa;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 1.2rem;
    }

    section {
      background: #fff;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.4rem;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }

    h2 {
      font-size: 1.05rem;
      margin: 0 0 .8rem;
    }

    small {
      color: #666;
    }
  </style>
</head>
<body>
  <h1>
    Lambda Canteen Dashboard
    <small id="day"></small>
  </h1>

  <section>
    <h2>Revenue by category: batch + speed</h2>
    <canvas id="revenueChart" height="120"></canvas>
  </section>

  <section>
    <h2>Top selling items: batch + speed</h2>
    <canvas id="topItemsChart" height="120"></canvas>
  </section>

  <section>
    <h2>Orders per hour: batch + speed</h2>
    <canvas id="ordersPerHourChart" height="120"></canvas>
  </section>

  <script src="/app.js"></script>
</body>
</html>
