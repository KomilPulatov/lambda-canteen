services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [lambda_net]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks: [lambda_net]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    networks: [lambda_net]

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks: [lambda_net]

  jobmanager:
    build: ./flink_cluster
    image: lambda-canteen-flink:1.19-python-kafka
    command: jobmanager
    ports:
      - "${FLINK_UI_PORT:-8081}:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    networks: [lambda_net]

  taskmanager:
    build: ./flink_cluster
    image: lambda-canteen-flink:1.19-python-kafka
    depends_on: [jobmanager]
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    networks: [lambda_net]

  producer:
    build: ./ingest
    depends_on: [kafka]
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-canteen_orders}
    restart: on-failure
    networks: [lambda_net]

  writer:
    build: ./storage_writer
    depends_on: [kafka]
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-canteen_orders}
      KAFKA_GROUP: ${KAFKA_GROUP:-raw-writer-v1}
      RAW_BASE: /data/raw
      FLUSH_INTERVAL: "${FLUSH_INTERVAL:-60}"
    volumes:
      - ./data:/data
    restart: on-failure
    networks: [lambda_net]

  batch:
    build: ./batch
    depends_on: [clickhouse]
    environment:
      RAW_BASE: /data/raw
      CH_HOST: clickhouse
      CH_PORT: "8123"
    volumes:
      - ./data:/data
    networks: [lambda_net]

  speed:
    build: ./speed
    depends_on: [kafka, redis, jobmanager, taskmanager]
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-canteen_orders}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SPEED_TTL: "${SPEED_TTL:-7200}"
    networks: [lambda_net]

  api:
    build: ./api
    depends_on: [clickhouse, redis]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      CH_HOST: clickhouse
      CH_PORT: "8123"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    restart: on-failure
    networks: [lambda_net]

networks:
  lambda_net:
    driver: bridge
